<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal giả · dữ liệu giả</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #162b36; background: #f1f6f6; font: 1rem/1.55 system-ui, sans-serif; }
  header { background: #103a43; color: white; }
  header > div, main { max-width: 72rem; margin: auto; padding: 1.25rem clamp(1rem, 4vw, 3rem); }
  header > div { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  header strong { font-size: 1.2rem; }
  select { margin-left: .5rem; padding: .45rem .7rem; font: inherit; color: #102a33; background: white; border-radius: .4rem; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; padding: .75rem 0 1.25rem; }
  nav a { color: #274651; text-decoration: none; padding: .55rem .8rem; border-radius: .4rem; }
  nav a[aria-current] { background: #d7eeea; color: #104b45; font-weight: 700; }
  h1 { margin: 0 0 1.25rem; font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.15; }
  h2 { margin: 0 0 .6rem; font-size: 1.15rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .card { background: white; border: 1px solid #d4e2e3; border-radius: .7rem; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .grid .card { margin: 0; }
  .value { font-size: 1.55rem; font-weight: 700; margin: 0; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem; padding: .75rem 0; }
  .rows li + li { border-top: 1px solid #e0e9eb; }
  .rows span { color: #345c61; }
  :focus-visible { outline: 3px solid #c77b21; outline-offset: 3px; }
</style>
<header><div>
  <strong>Portal giả · dữ liệu giả</strong>
  <label>Học viên giả
    <select id="student">
      <option>HV001</option><option>HV002</option><option>HV003</option>
    </select>
  </label>
</div></header>
<main>
  <nav aria-label="Các trang portal">
    <a href="#tong-quan">Tổng quan</a>
    <a href="#tien-do">Tiến độ của tôi</a>
    <a href="#bai-nop">Bài nộp của tôi</a>
    <a href="#lich">Lịch sự kiện</a>
  </nav>
  <h1></h1>
  <div id="content" aria-live="polite"></div>
</main>
<script>
  const student = document.getElementById('student');
  const title = document.querySelector('h1');
  const content = document.getElementById('content');
  const links = [...document.querySelectorAll('nav a')];
  let currentRequest;

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function card(label, ...children) {
    const section = element('section', undefined, 'card');
    section.append(element('h2', label), ...children);
    return section;
  }

  function metrics(entries) {
    const grid = element('div', undefined, 'grid');
    for (const [label, value] of entries) {
      grid.append(card(label, element('p', value, 'value')));
    }
    return grid;
  }

  function rows(label, entries) {
    const list = element('ul', undefined, 'rows');
    for (const [name, detail] of entries) {
      const item = element('li');
      item.append(element('strong', name), element('span', detail));
      list.append(item);
    }
    return card(label, list.childElementCount ? list : element('p', 'Chưa có dữ liệu.'));
  }

  function render(page, data) {
    const {xp, diem_danh, daily_standup, gate, deadline, coach_phu_trach} = data;
    if (page === '#tien-do') {
      const attendance = (items) => items.map(item => [item.buoi, item.ngay + ' · ' + item.trang_thai]);
      content.append(metrics([
        ['Tổng XP', xp.tong], ['Cấp độ', xp.level], ['Vai trò hiện tại', xp.role_discord],
        ['XP cần để lên ' + xp.role_ke, xp.xp_toi_role_ke]
      ]), rows('Điểm danh workshop', attendance(diem_danh.workshop)),
      rows('Điểm danh mentor duty', attendance(diem_danh.mentor_duty)));
    } else if (page === '#bai-nop') {
      content.append(metrics([['Daily standup hôm nay', daily_standup.hom_nay]]),
        rows('Trạng thái các gate', gate.map(item => [item.ma + ' · ' + item.ten, item.trang_thai])));
    } else if (page === '#lich') {
      const gatesWithDeadline = gate.filter(item => item.han);
      content.append(rows('Mốc nộp bài', [
        ...deadline.map(item => [item.ten, item.han]),
        ...gatesWithDeadline.map(item => [item.ma + ' · ' + item.ten, item.han])
      ]), rows('Buổi học và mentor duty', [...diem_danh.workshop, ...diem_danh.mentor_duty]
        .map(item => [item.buoi, item.ngay])));
    } else {
      content.append(metrics([
        ['Tổng XP', xp.tong], ['Cấp độ', xp.level], ['Daily standup hôm nay', daily_standup.hom_nay]
      ]), rows('Hồ sơ', [['Mã học viên giả', student.value], ['Coach phụ trách', coach_phu_trach]]),
      rows('Trạng thái các gate', gate.map(item => [item.ma + ' · ' + item.ten, item.trang_thai])));
    }
  }

  async function update() {
    const active = links.find(link => link.hash === location.hash) || links[0];
    for (const link of links) link.removeAttribute('aria-current');
    active.setAttribute('aria-current', 'page');
    title.textContent = active.textContent;
    currentRequest?.abort();
    const request = new AbortController();
    currentRequest = request;
    content.textContent = 'Đang tải hồ sơ…';
    try {
      const response = await fetch('/demo/api/' + encodeURIComponent(student.value), {signal: request.signal});
      if (!response.ok) throw new Error('Unable to load demo profile');
      const payload = await response.json();
      if (request.signal.aborted) return;
      content.replaceChildren();
      render(active.hash, payload.du_lieu);
    } catch (error) {
      if (!request.signal.aborted) content.textContent = 'Không tải được hồ sơ. Hãy tải lại trang hoặc chọn lại học viên.';
    }
  }

  student.addEventListener('change', update);
  window.addEventListener('hashchange', update);
  update();
</script>
</html>
