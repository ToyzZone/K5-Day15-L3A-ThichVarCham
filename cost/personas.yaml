# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 300
  base: 700
  high: 1000
  source: "(ví dụ) track A — thay bằng số của nhóm. Cơ sở: lớp L3 hơn 700 học viên (README hackathon); thấp, cao: (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
                    # Nguồn chung: evidence/data-mining.md mục 3f — 303 người hỏi Kute, 848 lượt trong 23 ngày (05–27/11).
                    # uses_per_month = số lượt ÷ số người × 30/23 (quy 23 ngày ra tháng 30 ngày — tự ước tính).
                    # turns_per_session = 1: data đếm theo lượt, không có "phiên" — coi mỗi lượt là một phiên (tự ước tính).
  - name: dung_it
    share: 0.70             # 212/303 người
    uses_per_month: 1.6     # 267 lượt ÷ 212 người = 1,26 lượt / 23 ngày × 30/23
    turns_per_session: 1
    source: "evidence/data-mining.md mục 3f: kiểu Ít (1–2 lượt), 212 người, 267 lượt / 23 ngày; quy ra tháng 30 ngày và 1 lượt = 1 phiên (tự ước tính)"
  - name: dung_vua
    share: 0.22             # 67/303 người
    uses_per_month: 5.3     # 274 lượt ÷ 67 người = 4,09 lượt / 23 ngày × 30/23
    turns_per_session: 1
    source: "evidence/data-mining.md mục 3f: kiểu Vừa (3–6 lượt), 67 người, 274 lượt / 23 ngày; quy ra tháng 30 ngày và 1 lượt = 1 phiên (tự ước tính)"
  - name: dung_nhieu
    share: 0.08             # 24/303 người
    uses_per_month: 16.7    # 307 lượt ÷ 24 người = 12,79 lượt / 23 ngày × 30/23
    turns_per_session: 1
    source: "evidence/data-mining.md mục 3f: kiểu Nhiều (≥7 lượt), 24 người, 307 lượt / 23 ngày; quy ra tháng 30 ngày và 1 lượt = 1 phiên (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
